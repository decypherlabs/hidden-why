name: divya-tweaks
on:
  push:
    branches: [divya-tweaks]
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q git+https://github.com/huggingface/parler-tts.git
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q sentencepiece==0.2.2 soundfile
      - env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
        run: python tools/divya_tweaks.py out/divya
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: divya, path: out/divya}
