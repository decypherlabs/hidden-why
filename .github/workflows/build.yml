name: build
run-name: build ${{ inputs.slug }}  # studio/thw_kaggle.py finds its run by this name
# Paintings come from the GPU notebook (gpu/hidden_why.ipynb on Colab/Kaggle) as release paint-<slug>;
# this narrates, edits and makes the thumbnail. A script's "paint_from" reuses another episode's paintings
# (the Hindi editions, episodes/<slug>-hi: no GPU needed). placeholder=true skips the paintings (test the edit).
on:
  workflow_dispatch:
    inputs:
      slug:
        required: true
      placeholder:
        default: "false"
permissions:
  contents: write
jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Hindi long-form: ~10 min of Parler narration on CPU takes ~2-3 h (6 Nov 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg libraqm0 libfribidi0 libharfbuzz0b > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: hiddenwhy-v1
      - name: Episode folder
        run: |
          S="${{ inputs.slug }}"
          if [ -d "episodes/$S" ]; then EP="episodes/$S"; else EP="episodes/${S#smoke-}"; fi   # smoke tests reuse an episode
          echo "EP=$EP" >> "$GITHUB_ENV"
          echo "HW_BRAND=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('brand') or '')" "$EP/script.json")" >> "$GITHUB_ENV"
      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          if grep -q '"parler"' "$EP/script.json" || { [ -n "$HW_BRAND" ] && grep -q '"parler"' "brand/$HW_BRAND/brand.json"; }; then
            pip install -q git+https://github.com/huggingface/parler-tts.git
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q sentencepiece==0.2.2  # 0.2.3 (5 Nov 2026) needs a newer protobuf than parler-tts gets: every Hindi build failed
          fi
      - name: Hindi text shaping
        run: |
          python -c "from PIL import features; assert features.check('raqm'), 'no raqm, Devanagari would render broken'"
      - name: Paintings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "out/${{ inputs.slug }}"
          if [ "${{ inputs.placeholder }}" = "true" ]; then
            python pipeline/placeholder.py "$EP/script.json" "out/${{ inputs.slug }}"
          else
            P=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('paint_from') or sys.argv[2])" "$EP/script.json" "${EP#episodes/}")  # smoke-<slug> tests paint from <slug>
            gh release download "paint-$P" -R "$GITHUB_REPOSITORY" -D out
            tar -xf "out/paint-$P.tar" -C "out/${{ inputs.slug }}"
          fi
      - name: Narration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # the narration the owner already heard and approved (narrate.yml) when the lines and voice are unchanged
          T="voice-${EP#episodes/}-$(python3 tools/voicehash.py "$EP/script.json")"
          # a preview edit of an episode's first minute reuses that episode's approved narration ("voice_from")
          V=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('voice_from') or '')" "$EP/script.json")
          [ -z "$V" ] || T="voice-$V-$(python3 tools/voicehash.py "episodes/$V/script.json")"
          if gh release download "$T" -R "$GITHUB_REPOSITORY" -p voice.tar -D out 2>/dev/null; then
            tar -xf out/voice.tar -C "out/${{ inputs.slug }}" && echo "narration reused from $T"
          elif grep -q '"voice_ok"' "$EP/script.json"; then
            # the owner approved a voiceover: never make another one in a build (owner, 7 Nov 2026)
            echo "::error::approved narration $T not found; the build won't narrate again" && exit 1
          else
            python pipeline/narrate.py "$EP/script.json" "out/${{ inputs.slug }}"
          fi
      - name: Edit
        run: |
          python pipeline/build.py "$EP/script.json" "out/${{ inputs.slug }}"
      - name: Thumbnail
        run: |
          # a ready-made thumbnail the owner chose (episodes/<slug>/thumb-custom.jpg) wins over the generated one
          if [ -f "$EP/thumb-custom.jpg" ]; then cp "$EP/thumb-custom.jpg" "out/${{ inputs.slug }}/thumb.jpg"
          elif [ -n "$HW_BRAND" ] && grep -q '"thumbnails": "owner"' "brand/$HW_BRAND/brand.json"; then
            echo "the owner makes this channel's thumbnails (ChatGPT): none generated"
          else python pipeline/thumb.py "$EP/script.json" "out/${{ inputs.slug }}"; fi
      - name: Collect
        run: |
          mkdir -p final && cd "out/${{ inputs.slug }}"
          cp video.mp4 chapters.txt ../../final/ && { [ ! -f thumb.jpg ] || cp thumb.jpg ../../final/; }
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("../../" + __import__("os").environ["EP"] + "/meta.json").read_text())
          ch = pathlib.Path("chapters.txt").read_text()
          m["youtube"]["description"] = m["youtube"]["description"].replace("{CHAPTERS}", ch)
          pathlib.Path("../../final/meta.json").write_text(json.dumps(m, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.slug }}
          path: final
          retention-days: 14
          compression-level: 0
